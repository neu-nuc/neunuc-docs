site_name: NeuNuc Internal Operating Manual
site_description: Proprietary system documentation. Not for public distribution.
site_url: https://docs.neunuc.com/
repo_url: https://github.com/neu-nuc/neunuc
repo_name: neu-nuc/neunuc
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 NeuNuc. Internal use only.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: moon
        name: Switch to light mode
  icon:
    admonition:
      note: note
      tip: abstract
      warning: warning
      danger: danger
      info: info
      success: success
      abstract: note
      question: faq
      bug: bug
      example: example
      quote: quote
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link

nav:
  - Home: index.md
  - Lenses: lenses.md
  - Site Map: sitemap.md
  - Systems:
      - Overview: overview.md
      - Getting Started: getting-started.md
      - Architecture: architecture.md
      - Deployment: deployment.md
      - Outreach Surfaces: outreach.md
      - Security & Policy: security.md
      - Core & Observability: core.md
      - Control Stack: control-stack.md
      - Infrastructure: infra.md
      - CI/CD: ci-cd.md
      - Scripts & Automation: scripts.md
  - Ecosystem:
      - Monorepo: monorepo.md
      - Config System: config-system.md
      - Metasystem: metasystem.md
      - Public Release: public-release.md
  - Apps:
      - Ops Workspace: ops-workspace.md
      - nuc CLI: cli.md
      - Runtime: runtime.md
      - Operator Dashboard: operator-dashboard.md
      - NucBot: nucbot.md
      - Customer VC: customer-vc.md
      - Customer VC Pilot: customer-vc-pilot.md
      - Discord Bot Runtime: discord-bot.md
      - API Reference: api.md
      - Models: models.md
      - WebSocket & Real-time: websocket.md
      - Examples: examples.md
  - Box Fulfillment:
      - Product Strategy: box-strategy.md
      - System Architecture: box-system-architecture.md
      - Software Architecture: box-software-architecture.md
      - Deployment: box-deployment.md
      - Stripe Setup: box-stripe-setup.md
      - Pack Station SOP: box-pack-station.md
      - Box Builder: box-builder.md
  - Tech:
      - Configuration: configuration.md
      - Usage: usage.md
      - Templates & Builders: templates.md
      - Stripe Checkout Worker: stripe-checkout.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Glossary: glossary.md
      - Changelog: changelog.md
      - Build Log: build-log.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  generator: false
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neu-nuc/neunuc
      name: NeuNuc on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
