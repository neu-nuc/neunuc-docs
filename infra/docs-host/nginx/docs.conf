# Internal docs host — Basic Auth required
# Serves the MkDocs-built static site on port 80
# For local Docker or reverse-proxy behind TLS termination

server {
    listen 80;
    server_name localhost docs.neunuc.com internal.neunuc.com;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # Basic auth for all routes
    auth_basic "NeuNuc Internal Docs";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # MkDocs generates .html files; serve without extension
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
